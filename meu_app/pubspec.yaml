name: meu_app
description: "Chefim - Seu companheiro inteligente na cozinha."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.13.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  bcrypt: ^1.2.0
  cupertino_icons: ^1.0.8
  google_mlkit_text_recognition: ^1.0.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  openfoodfacts: ^3.31.1
  path: ^1.9.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  supabase_flutter: ^2.18.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/animations/chefim_loading.gif

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/chefim_icon.png"
  min_sdk_android: 21